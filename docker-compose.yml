# Optional local services. Dev works without them (SQLite + in-memory cache/limiter).
#   docker compose up -d postgres redis
# then in backend/.env:
#   DATABASE_URL=postgresql+asyncpg://marketpulse:marketpulse@127.0.0.1:5432/marketpulse
#   REDIS_URL=redis://127.0.0.1:6379/0
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse # local development only
      POSTGRES_DB: marketpulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
